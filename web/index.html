<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Make sense of Stellaris crash reports (exception.txt): what crashed, where, and in which game function." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111113'/><path d='M10 21l6-11 6 11' fill='none' stroke='%234DA3FF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Stellaris Exception Translator</title>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Stellaris Exception Translator</h1>
        <p id="supported" class="muted"></p>
      </header>

      <section id="drop" class="drop" aria-label="Choose crash files">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
          <path d="M14 3v6h6M12 17v-6M9 14l3-3 3 3" />
        </svg>
        <div class="drop-text">
          <p class="drop-title">Drop your crash folder here</p>
          <p class="muted small drop-hint">
            Find it in <code>Documents\Paradox Interactive\Stellaris\crashes</code>, or paste the text of exception.txt.
          </p>
        </div>
        <button type="button" id="pick-files" class="primary">Choose files</button>
        <input type="file" id="files-input" multiple accept=".txt,.yml,.dmp,.zip" hidden />
      </section>

      <div id="report" aria-live="polite"></div>
    </main>

    <footer class="wrap small muted">
      <p>
        Unofficial community tool, not affiliated with Paradox Interactive.
        <a href="https://github.com/Tempest113/stellaris-exception-translator">Source code and crash-reading guide</a>
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
